name: Build FreeBian ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # The runner has little free disk; live-build needs ~15 GB
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      # Build inside Debian trixie so live-build and debootstrap are Debian's own, not Ubuntu's fork
      - name: Build ISO
        run: |
          chmod +x init-freebian.sh build-freebian.sh
          docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends sudo curl gnupg python3 ca-certificates
            ./init-freebian.sh
            ./build-freebian.sh
          '

      - name: Show result
        run: ls -lh freebian-amd64.iso*; cat freebian-amd64.iso.sha256

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: freebian-build/build.log
          if-no-files-found: ignore

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: freebian-iso
          path: |
            freebian-amd64.iso
            freebian-amd64.iso.sha256
          compression-level: 0
          retention-days: 7
